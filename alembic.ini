[alembic]
script_location = migrations_alembic
# NO executable DSN lives here (CF-BB-1 = NEW_STRUCTURE · OI-BB-2).
# The migration identity is resolved ONLY in env.py, from:
#   1) UAP_MIGRATION_DATABASE_URL   (canonical migration identity source)
#   2) explicit `config.attributes["url"]` (tests / CI programmatic override)
#   3) otherwise FAIL-CLOSED.
# DATABASE_URL is RUNTIME-ONLY and is never used for migrations, and this file
# deliberately carries no connection string that could act as a fallback.
# A commented, non-executable example (never parsed by Alembic):
# sqlalchemy.url = postgresql+psycopg://<migration-role>:<password>@<host>:<port>/<db>

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
