[alembic]
script_location = migrations_alembic
# Runtime URL is resolved in env.py: 1) explicit `-x url=` 2) DATABASE_URL env
# 3) this default (dev docker-compose). Never commit a real secret here.
sqlalchemy.url = postgresql+psycopg://uap:uap@localhost:5432/uap

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
