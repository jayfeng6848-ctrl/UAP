[project]
name = "uap"
version = "0.1.14"
description = "Universal AI Platform - business-agnostic agent platform core"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.19.2",
    "psycopg[binary]==3.2.3",
    "argon2-cffi==25.1.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable PostgreSQL instance",
    "architecture: dependency-rule enforcement",
    "security: secret and hardening checks",
    "contract: API response contract checks",
]

[tool.ruff]
line-length = 100
target-version = "py313"
