services:
  postgres:
    image: postgres:16-alpine
    container_name: uap-postgres
    environment:
      # Local development credentials only. Never reuse in any shared environment.
      POSTGRES_USER: uap
      POSTGRES_PASSWORD: uap
      POSTGRES_DB: uap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uap -d uap"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: uap-api
    environment:
      APP_ENV: development
      APP_NAME: UAP
      APP_VERSION: 0.1.11
      # RUNTIME identity only (D-OP101-10 / CF-BB-3 = A). The api service must
      # NEVER receive UAP_MIGRATION_DATABASE_URL: the runtime cannot read or
      # fall back to the migration DSN.
      DATABASE_URL: postgresql+psycopg://uap:uap@postgres:5432/uap
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # MIGRATION identity: this compose file deliberately defines NO migration
  # service / entrypoint (OI-BB-5 = NO EXISTING CI CARRIER / NO CREATION
  # AUTHORIZED). Alembic is executed out of band with
  #   UAP_MIGRATION_DATABASE_URL=postgresql+psycopg://<migration-role>:<pw>@<host>/<db>
  # and reads ONLY that key -- it never uses DATABASE_URL (see
  # migrations_alembic/env.py and migrations_alembic/README.md).

  # Optional: enable with `docker compose --profile cache up -d`.
  redis:
    image: redis:7-alpine
    container_name: uap-redis
    profiles: ["cache"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
